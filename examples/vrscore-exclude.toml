findings = "findings.json"
format = "table"
summary = true
only_reachable = true
exclude_asset = ["batch-worker"]
exclude_tag = ["dmz"]
# Optional: exclude_cve = ["CVE-1999-0001"]
sort = "priority"
dedupe = true
